---

# Defaults vars file for airflow role

# Airflow installation tasks
airflow_system_dependencies: "{{ _airflow_system_dependencies }}"

# Set changed when due to idempotency problem with pip module
# Always changed with airflow and airflow[crypto]
airflow_pip_changed_when: false

# Ansible's pip module doesn't currently support complex version strings
# https://github.com/ansible/ansible/issues/19321
# And Airflow may currently require custom version strings
# https://stackoverflow.com/a/48075827
airflow_pip_custom_version_install: false

airflow_version: '3.3.0'

# Installation vars
airflow_user_name: 'airflow'
airflow_user_group: "{{ airflow_user_name }}"
airflow_user_shell: '/bin/bash'
airflow_user_home_path: '/var/lib/airflow'
airflow_application_home: "/var/lib/airflow/airflow"
airflow_user_home_mode: '0700'

airflow_log_path: '/var/log/airflow'
airflow_log_owner: "{{ airflow_user_name }}"
airflow_log_group: "{{ airflow_user_group }}"
airflow_log_mode: '0700'

airflow_pid_path: '/var/run/airflow'
airflow_pid_owner: "{{ airflow_user_name }}"
airflow_pid_group: "{{ airflow_user_group }}"
airflow_pid_mode: '0700'

airflow_virtualenv: "{{ airflow_user_home_path }}/venv3.12"
airflow_virtualenv_mode: "0755"

airflow_google_client_id: "your-client-id"
airflow_google_client_secret: "your-client-secret"

airflow_celery:
  broker_url: >-
    {{
      (
        "redis://:{}@{}:{}/1".format(redis_requirepass, redis_bind_interface, redis_port)
      )
      if (redis_requirepass is defined and redis_requirepass)
      else
      (
        "redis://{}:{}/1".format(redis_bind_interface, redis_port)
      )
    }}
  result_backend: >-
    {{
      (
        "db+postgresql+psycopg2://{}:{}@{}/airflow".format(
          postgres_airflow_user,
          postgres_airflow_password,
          postgres_hostname | default('localhost')
        )
      )
      if (postgres_airflow_user is defined and postgres_airflow_password is defined)
      else ""
    }}  worker_concurrency: 16
airflow_executor: "LocalExecutor"
redis_requirepass: ""
redis_bind_interface: "localhost"
redis_port: 6379

airflow_python_version: "{{ _airflow_python_version }}"
python_version: "3.12.13"
# On RHEL/Rocky, /usr/bin/python3 is an RPM-owned symlink to python3.9 that
# 'CONFIG | Use Python 3.12 as default selection' (community.general.alternatives)
# does not actually redirect - /etc/alternatives/python3 points at 3.12 but the
# real /usr/bin/python3 file never gets repointed into it. Using the ambient
# python3 to create the venv silently gets you a 3.9 venv named 'venv3.12'.
# Be explicit instead.
airflow_venv_python: "/usr/bin/python3.12"
# Update if python version or apache airflow version changes.
airflow_python_constraint: "--constraint=https://raw.githubusercontent.com/apache/airflow/constraints-{{ airflow_version }}/constraints-3.12.txt"
dags_repos_folder: "{{ airflow_user_home_path ~ '/airflow/dags_repos' }}"
dags_folder: "{{ airflow_user_home_path ~ '/airflow/dags' }}"

airflow_packages:
  - name: 'GitPython'
  - name: 'Cython'
  - name: 'apache-airflow'
    version: '{{ airflow_version }}'
  - name: 'pipenv'
  - name: 'numpy'
  - name: 'apache-airflow-providers-amazon'
  - name: 'apache-airflow-providers-fab'
  - name: 'authlib'
  - name: 'apache-airflow-providers-sendgrid'
  - name: 'apache-airflow-providers-sftp'
  # Airflow 3 also opens an async SQLAlchemy session for the metadata DB
  # (settings.py _configure_async_session); for postgres that needs asyncpg
  # in addition to the sync psycopg2 driver.
  - name: 'psycopg2-binary'
  - name: 'asyncpg'
  # pinned: unconstrained resolves against Airflow's already-installed modern
  # paramiko/cryptography and backtracks all the way into fabric's abandoned
  # pre-Python-3 releases (which don't even build) before giving up
  - name: 'fabric'
    version: '3.2.3'
  # requests/aiohttp are already pinned by Airflow's own constraints file and
  # pulled in transitively by apache-airflow itself - listing them again here
  # only adds a redundant install step that can conflict with that pin
  - name: 'selenium'
  - name: 'selenium-screenshot'
  - name: 'openpyxl'


dag_packages: []

# option to set environment for all users,
# by providing a file in /etc/profile.d/
airflow_provide_user_env: true
airflow_profiled_template: "templates/airflow.profile.j2"

airflow_auth_enabled: true

# SERVICES MANAGEMENT
# -----------------------------------------------------------------------------

# Airflow systemd services specific settings
is_systemd_managed_system: "{{ _is_systemd_managed_system | default(false) }}"
airflow_enable_dag_processor: true
airflow_enable_triggerer: true
airflow_systemd_wants: "postgresql.service mysql.service redis.service rabbitmq-server.service"
airflow_services_systemd:
  - dest: '/etc/systemd/system/airflow-api-server.service'
    handler: 'Restart airflow-api-server' 
    options:
      Install:
        WantedBy: 'multi-user.target'
      Service:
        Environment: "PATH={{ airflow_virtualenv ~ '/bin' }}"
        EnvironmentFile: "{{ airflow_service_envfile_path }}"
        ExecStart: "{{ airflow_virtualenv ~ '/bin' }}/airflow api-server"
        Group: "{{ airflow_user_group }}"
        PrivateTmp: 'true'
        Restart: 'on-failure'
        RestartSec: '5s'
        Type: 'simple'
        User: "{{ airflow_user_name }}"
      Unit:
        After: 'network.target {{ airflow_systemd_wants }}'
        Description: 'Airflow API server daemon'
        Wants: '{{ airflow_systemd_wants }}'
  - dest: '/etc/systemd/system/airflow-scheduler.service'
    handler: 'Restart airflow-scheduler'
    options:
      Install:
        WantedBy: 'multi-user.target'
      Service:
        Environment: "PATH={{ airflow_virtualenv ~ '/bin' }}"
        EnvironmentFile: "{{ airflow_service_envfile_path }}"
        ExecStart: "{{ airflow_virtualenv ~ '/bin' }}/airflow scheduler"
        Group: "{{ airflow_user_group }}"
        PrivateTmp: 'true'
        Restart: 'always'
        RestartSec: '5s'
        Type: 'simple'
        User: "{{ airflow_user_name }}"
      Unit:
        After: 'network.target {{ airflow_systemd_wants }}'
        Description: 'Airflow scheduler daemon'
        Wants: '{{ airflow_systemd_wants }}'
  - dest: '/etc/systemd/system/airflow-dag-processor.service'
    handler: 'Restart airflow-dag-processor'
    managed: "{{ airflow_enable_dag_processor | bool }}"
    options:
      Install:
        WantedBy: 'multi-user.target'
      Service:
        Environment: "PATH={{ airflow_virtualenv ~ '/bin' }}"
        EnvironmentFile: "{{ airflow_service_envfile_path }}"
        ExecStart: "{{ airflow_virtualenv ~ '/bin' }}/airflow dag-processor"
        Group: "{{ airflow_user_group }}"
        PrivateTmp: 'true'
        Restart: 'always'
        RestartSec: '5s'
        Type: 'simple'
        User: "{{ airflow_user_name }}"
      Unit:
        After: 'network.target {{ airflow_systemd_wants }}'
        Description: 'Airflow DAG processor daemon'
        Wants: '{{ airflow_systemd_wants }}'
  - dest: '/etc/systemd/system/airflow-triggerer.service'
    handler: 'Restart airflow-triggerer'
    managed: "{{ airflow_enable_triggerer | bool }}"
    options:
      Install:
        WantedBy: 'multi-user.target'
      Service:
        Environment: "PATH={{ airflow_virtualenv ~ '/bin' }}"
        EnvironmentFile: "{{ airflow_service_envfile_path }}"
        ExecStart: "{{ airflow_virtualenv ~ '/bin' }}/airflow triggerer"
        Group: "{{ airflow_user_group }}"
        PrivateTmp: 'true'
        Restart: 'always'
        RestartSec: '5s'
        Type: 'simple'
        User: "{{ airflow_user_name }}"
      Unit:
        After: 'network.target {{ airflow_systemd_wants }}'
        Description: 'Airflow triggerer daemon'
        Wants: '{{ airflow_systemd_wants }}'

airflow_services_states:
  - name: 'airflow-api-server'
    enabled: true
    state: 'started'
  - name: 'airflow-scheduler'
    enabled: true
    state: 'started'
  - name: 'airflow-dag-processor'
    enabled: true
    managed: "{{ airflow_enable_dag_processor | bool }}"
    state: 'started'
  - name: 'airflow-triggerer'
    enabled: true
    managed: "{{ airflow_enable_triggerer | bool }}"
    state: 'started'

# Environment variables file
airflow_service_envfile_template: 'templates/airflow.env.j2'
airflow_service_envfile_path: '/etc/default/airflow'

# Databases variables
airflow_manage_database: true
airflow_database_engine: 'mysql'
airflow_database_sqlite_file_path: "{{ airflow_user_home_path ~ '/airflow/airflow.db' }}"

airflow_sqlalchemy_conn: >-
  {{
    (
      "postgresql+psycopg2://{}:{}@{}/airflow".format(
        postgres_airflow_user,
        postgres_airflow_password,
        postgres_hostname | default('localhost')
      )
    )
    if (postgres_airflow_user is defined and postgres_airflow_password is defined)
    else
    ("sqlite:///" ~ airflow_database_sqlite_file_path)
  }}

airflow_webserver_authenticate: false

airflow_fernet_key: 'kV9w7m8Z0Z7l6dKX8f2Vg7sH3lQ0bW5cYyJt9eR2u1Q='

# Default configuration
airflow_config_template: "templates/airflow.cfg.j2"
airflow_defaults_config:
  core:
    auth_manager: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager 
    dags_folder: "{{ airflow_user_home_path ~ '/airflow/dags' }}"
    executor: "{{ airflow_executor }}"
    parallelism: 32
    dags_are_paused_at_creation: true
    default_pool_task_slot_count: 128
    max_active_runs_per_dag: 16
    load_examples: false
    plugins_folder: "{{ airflow_user_home_path ~ '/airflow/plugins' }}"
    fernet_key: "{{ airflow_fernet_key }}"
    dagbag_import_timeout: 30
    timezone: "{{ airflow_timezone }}"
  
  api:
    base_url: "{{ airflow_webserver_base_url | default('http://localhost:8080') }}"
    expose_config: true
    host: '0.0.0.0'
    port: '8080'
    # This is not real, temporary secret for testing purposes
    secret_key: '96868ea5c214b0df1f26e8114e7abcee01ad76b299fa0fc51f6b4116e249'
    workers: 1
    worker_timeout: 30

  dag_processor:
    parsing_processes: 2

  database:
    sql_alchemy_conn: "{{ airflow_sqlalchemy_conn }}"
    sql_alchemy_pool_size: 5
    sql_alchemy_pool_recycle: 3600

  email:
    email_backend: 'airflow.providers.sendgrid.utils.emailer.send_email'
    email_conn_id: 'sendgrid_default'
    from_email: '{{ airflow_smtp_mail_from }}'

  smtp:
    smtp_host: '{{ airflow_smtp_host }}'
    smtp_starttls: '{{ airflow_smtp_starttls }}'
    smtp_ssl: '{{ airflow_smtp_ssl }}'
    smtp_user: '{{ airflow_smtp_user }}'
    smtp_port: '{{ airflow_smtp_port }}'
    smtp_password: '{{ airflow_smtp_password }}'
    smtp_mail_from: '{{ airflow_smtp_mail_from }}'

  ldap: {}

  logging:
    base_log_folder: "{{ airflow_log_path }}"
    remote_base_log_folder: ''
    remote_log_conn_id: ''

  mesos: {}

  metrics:
    statsd_on: false
    statsd_host: 'localhost'
    statsd_port: 8125
    statsd_prefix: 'airflow'

  operators:
    default_queue: 'default'
    default_owner: 'Airflow'

  scheduler:
    catchup_by_default: True
    job_heartbeat_sec: 5
    max_tis_per_query: 0
    pid: "{{ airflow_pid_path }}/airflow-scheduler.pid"
    scheduler_heartbeat_sec: 5

airflow_user_config: {}
airflow_config: "{{ airflow_defaults_config | combine(airflow_user_config, recursive=true) }}"

# Airflow Api Server Users management
airflow_webserver_admins:
  - google_username: "google_113716629440137414774"
    email: "tuj27080@temple.edu"
    firstname: "David"
    lastname: "Kinzer"
    airflow_dummy_password: "dummy-password"

# Connections management
airflow_connections:
  - conn_id: "ANSIBLE_TEST"
    conn_uri: "http://localhost:9999"

# Variables management
airflow_variables:
  - key: "ANSIBLE_TEST"
    value: "test_value"

# Logrotate configuration
airflow_logrotate_template: "templates/logrotate.j2"
airflow_logrotate_config:
  - filename: '/etc/logrotate.d/airflow'
    log_pattern:
      - "{{ airflow_log_path }}/*.log"
    options:
      - 'rotate 12'
      - 'weekly'
      - 'compress'
      - 'delaycompress'
      - "create 640 {{ airflow_log_owner }} {{ airflow_log_group }}"
      - 'postrotate'
      - 'endscript'

# Git setup for cloning DAGs into Airflow DAG folder
workspace: "{{ airflow_config.core.dags_folder }}"
dags_git_repositories:
  - repo: "https://github.com/tulibraries/cob_datapipeline.git"
    dest_folder: "cob_datapipeline"
    branch_or_release: "main"
dags_related_git_repositories:
  - repo: "https://github.com/tulibraries/tul_cob.git"
    dest_folder: "$HOME/tul_cob"
    branch_or_release: "main"

airflow_dag_system_dependencies:
  - name: "@Development tools"
    state: "present"

python_deps: ""
dag_deps: ""
